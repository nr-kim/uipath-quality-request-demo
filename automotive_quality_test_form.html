<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Automotive Quality Request Form</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 8px; }
    .sub { color: #555; margin-bottom: 24px; }
    label { display: block; margin-top: 14px; font-weight: 600; }
    input, select, textarea { width: 100%; box-sizing: border-box; padding: 10px; margin-top: 6px; border: 1px solid #bbb; border-radius: 6px; }
    textarea { min-height: 90px; }
    button { margin-top: 20px; padding: 10px 18px; cursor: pointer; }
    #result { display:none; margin-top:20px; padding:12px; border:1px solid #aaa; border-radius:6px; background:#f4f4f4; }
  </style>
</head>
<body>
  <h1>Automotive Quality Request</h1>
  <div class="sub">Test form for UiPath RPA practice</div>

  <form id="qualityForm">
    <label for="requestId">Request ID</label>
    <input id="requestId" name="requestId" type="text">

    <label for="partNumber">Part Number</label>
    <input id="partNumber" name="partNumber" type="text">

    <label for="partName">Part Name</label>
    <input id="partName" name="partName" type="text">

    <label for="supplier">Supplier</label>
    <input id="supplier" name="supplier" type="text">

    <label for="issueType">Issue Type</label>
    <input id="issueType" name="issueType" type="text">

    <label>Priority</label>
    <input id="priority" name="priority" type="text">

    <label for="description">Description</label>
    <textarea id="description" name="description"></textarea>

    <button id="submitBtn" type="submit">Submit Request</button>
  </form>

  <div id="result">Request submitted successfully.</div>

  <script>
    document.getElementById('qualityForm').addEventListener('submit', function(e) {
      e.preventDefault();
      document.getElementById('result').style.display = 'block';
      setTimeout(() => {
        this.reset();
        document.getElementById('result').style.display = 'none';
      }, 1200);
    });
  </script>
</body>
</html>
